server {
    listen 80 default_server;
    server_name shop.example.com "~^(?<sub>.+)\.shop\.example\.com$";
    root /var/www/shop;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location /static {
        alias /var/www/static;
        if ($request_method = POST) { return 405; }
    }
}
