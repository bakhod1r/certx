<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName blog.example.org
    ServerAlias www.blog.example.org
    DocumentRoot "/var/www/blog"
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/blog.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/blog.example.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
